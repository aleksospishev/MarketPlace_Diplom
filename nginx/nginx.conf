
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:8000;
    }

    server {

        listen 80;
        server_name 127.0.0.1;
        server_tokens off;

        location /static/ {
            alias /static/;
        }

        location /media/ {
            alias /media/;
        }
        location / {
            proxy_pass http://django;
        }
    }
}