services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - db

  nginx:
      image: nginx:latest
      ports:
        - "80:80"
      volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/static

      depends_on:
        - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
